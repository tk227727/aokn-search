name: Update Transcript Status

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-transcripts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check transcripts
        run: python scripts/update_transcripts.py

      - name: Commit transcript status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/transcript_status.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update transcript status"
          git push
