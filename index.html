<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>青かなシーン検索</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
 background:#f6f7fb;
 color:#222
}

header{
 background:linear-gradient(135deg,#65bfff,#ffe16b);

}

}

header p{
 margin:8px 0 0;
 font-size:14px;

}

 max-width:760px;
 margin:auto;
 padding:18px
}

.card,.result{
 background:#fff;
 border-radius:18px;
 padding:16px;
 box-shadow:0 4px 18px rgba(0,0,0,.07)
}

.status{

}

}

.status.error{
 background:#fff0f0
}

.row{
 display:flex;

}

input{
 flex:1;

 border-radius:12px;

}

 border:0;

 padding:0 18px;

}

.filters{
 display:flex;

}

 margin-bottom:6px
}

.ao{

}

.kanade{

}

.regloss{
 color:#777
}

.title{

 line-height:1.5
}

.count{

 font-size:13px;
 color:#666
}

.open,.watch{
 display:block;
 width:100%;
 margin-top:13px;
 padding:11px;
 border-radius:10px;
 border:0;
 text-align:center;
 text-decoration:none;
 font-weight:700;
 font-size:14px
}

.open{
 background:#333;
 color:#fff
}

.watch{
 background:#ff0033;
 color:#fff
}

.time{
 font-weight:700;
 color:#168ad5;
 margin-top:9px
}

.text{
 margin-top:10px;
 line-height:1.75;
 font-size:14px;
 color:#444;
 word-break:break-word
}

mark{
 background:#fff0a8;
 padding:1px 2px;
 border-radius:3px
}

.empty{
 text-align:center;
 color:#888;
 padding:40px 10px
}

.note{
 font-size:12px;
 color:#777;
 line-height:1.6;
 margin-top:12px
}

.back{
 margin-bottom:12px;
 padding:9px 12px;
 background:#eee;
 color:#444
}
</style>
</head>

<body>

<header>
<h1>🔎 青かなシーン検索</h1>
<p>火威青 × 音乃瀬奏 × ReGLOSS</p>
</header>

<main>

<div class="card">

<div id="loadStatus" class="status">
検索データを読み込んでいます…
</div>

<div class="note" style="margin-top:0;margin-bottom:5px">
動画タイトル（1文字から）
</div>

<div class="row">
<input
 id="titleSearch"
 type="search"
 placeholder="例：マイクラ、歌、初配信"
>
</div>

<div class="note" style="margin-bottom:5px">
字幕（2文字以上）
</div>

<div class="row">
<input
 id="search"
 type="search"
 placeholder="例：奏ちゃん、青さん、かわいい"
>
<button id="searchButton">検索</button>
</div>

<div class="filters">
<button class="filter active" data-channel="all">
すべて
</button>

<button class="filter" data-channel="ao">
火威青
</button>

<button class="filter" data-channel="kanade">
音乃瀬奏
</button>

<button class="filter" data-channel="regloss">
ReGLOSS
</button>
</div>

<div class="note">
自動生成字幕を利用しているため、名前や固有名詞に誤変換が含まれる場合があります。
<br>
検索対象は字幕インデックス作成済みの動画から順次増えます。
</div>

</div>

<div id="summary">
読み込み中です
</div>

<div id="results"></div>

</main>

<script>

const CATALOG =
 "data/search-index/catalog.json";

const GLOBAL_MANIFEST =
 "data/search-index/global/manifest.json";

const GLOBAL_SHARD = id =>
 `data/search-index/global/${String(id).padStart(3,"0")}.json`;

const API = id =>
 `https://youtube-transcript.ai/transcript/${id}.txt?lang=ja`;

let catalog = [];
let currentChannel = "all";
let globalManifest = null;
let shardCache = new Map();
let lastMatches = [];

const $ = id =>
 document.getElementById(id);


function esc(s){

 return String(s).replace(
  /[&<>"']/g,
  c => ({
   "&":"&amp;",
   "<":"&lt;",
   ">":"&gt;",
   '"':"&quot;",
   "'":"&#039;"
  }[c])
 );

}


function norm(s){

 return String(s)
  .normalize("NFKC")
  .toLowerCase()
  .replace(/\s+/g,"");

}


function grams(s,n){

 const q = norm(s);
 const out = [];

 for(
  let i=0;
  i<=q.length-n;
  i++
 ){
  out.push(
   q.slice(i,i+n)
  );
 }

 return [...new Set(out)];

}


function decode(ds){

 let x = 0;

 return ds.map(
  (d,i) => (
   x = i
    ? x+d
    : d
  )
 );

}


function fmt(sec){

 const h =
  Math.floor(sec/3600);

 const m =
  Math.floor(sec%3600/60);

 const s =
  Math.floor(sec%60);

 return h
  ? `${h}:${String(m).padStart(2,"0")}:${String(s).padStart(2,"0")}`
  : `${m}:${String(s).padStart(2,"0")}`;

}


function timeToSeconds(t){

 return t
  .split(":")
  .map(Number)
  .reduce(
   (a,n) => a*60+n,
   0
  );

}


function cleanText(t){

 let s =
  t.replace(/\s+/g," ").trim();

 const parts =
  s
   .split(/(?<=[。！？!?])\s*/)
   .filter(Boolean);

 const out = [];

 for(const part of parts){

  const p =
   part.trim();

  if(!p)continue;

  if(
   out.length &&
   norm(p) ===
   norm(out[out.length-1])
  ){
   continue;
  }

  out.push(p);

 }

 s = out.join(" ");

 for(
  let size =
   Math.min(
    80,
    Math.floor(s.length/2)
   );

  size>=3;

  size--
 ){

  let changed = true;

  while(changed){

   changed = false;

   for(
    let i=0;
    i+size*2<=s.length;
    i++
   ){

    const a =
     s.slice(i,i+size);

    const b =
     s.slice(
      i+size,
      i+size*2
     );

    if(
     norm(a) &&
     norm(a)===norm(b)
    ){

     s =
      s.slice(0,i+size)
      +
      s.slice(i+size*2);

     changed = true;
     break;

    }

   }

  }

 }

 return s
  .replace(/\s+/g," ")
  .trim();

}


function parseTranscript(raw){

 raw = raw
  .replace(/\r\n/g,"\n")
  .replace(/\r/g,"\n");

 const marker =
  "## Transcript";

 const body =
  raw.includes(marker)
   ? raw.slice(
      raw.indexOf(marker)
      + marker.length
     )
   : raw;

 const lines =
  body.split("\n");

 const rows = [];

 const bracket =
  /^\s*\[((?:\d+:)?\d+:\d{2}(?:[.,]\d+)?)\]\s*(.*)$/;

 const plain =
  /^\s*((?:\d+:)?\d+:\d{2}(?:[.,]\d+)?)\s+(.+)$/;

 const cue =
  /^\s*((?:\d+:)?\d+:\d{2}[.,]\d+)\s+-->/;

 function parseTime(v){

  const p =
   v
    .trim()
    .replace(",",".")
    .split(":")
    .map(Number);

  if(
   p.some(
    n => !Number.isFinite(n)
   )
  ){
   return null;
  }

  if(p.length===3){

   return Math.floor(
    p[0]*3600
    + p[1]*60
    + p[2]
   );

  }

  if(p.length===2){

   return Math.floor(
    p[0]*60
    + p[1]
   );

  }

  return null;

 }

 let i = 0;

 while(i<lines.length){

  const line =
   lines[i];

  let m =
   bracket.exec(line);

  if(m){

   const t =
    parseTime(m[1]);

   const x =
    cleanText(m[2]);

   if(
    t!==null &&
    x
   ){
    rows.push({
     t,
     x
    });
   }

   i++;
   continue;

  }

  m =
   cue.exec(line);

  if(m){

   const t =
    parseTime(m[1]);

   i++;

   const parts = [];

   while(
    i<lines.length &&
    lines[i].trim() &&
    !cue.test(lines[i])
   ){

    if(
     !/^\d+$/.test(
      lines[i].trim()
     )
    ){
     parts.push(
      lines[i].trim()
     );
    }

    i++;

   }

   let x =
    parts.join(" ");

   x =
    x.replace(
     /<[^>]+>/g,
     " "
    );

   x =
    cleanText(x);

   if(
    t!==null &&
    x
   ){
    rows.push({
     t,
     x
    });
   }

   continue;

  }

  m =
   plain.exec(line);

  if(
   m &&
   !line.includes("-->")
  ){

   const t =
    parseTime(m[1]);

   const x =
    cleanText(m[2]);

   if(
    t!==null &&
    x
   ){
    rows.push({
     t,
     x
    });
   }

  }

  i++;

 }

 const cleaned = [];
 const seen = new Set();

 rows.sort(
  (a,b) => a.t-b.t
 );

 for(const row of rows){

  const key =
   `${row.t}\n${row.x}`;

  if(seen.has(key)){
   continue;
  }

  seen.add(key);

  if(cleaned.length){

   const prev =
    cleaned[
     cleaned.length-1
    ].x;

   if(
    norm(row.x)===
    norm(prev)
   ){
    continue;
   }

  }

  cleaned.push(row);

 }

 return cleaned;

}


function makeSnippet(
 text,
 word
){

 const n =
  text
   .normalize("NFKC")
   .toLowerCase();

 const q =
  word
   .normalize("NFKC")
   .toLowerCase();

 const p =
  n.indexOf(q);

 if(p<0){
  return text.slice(0,220);
 }

 const a =
  Math.max(
   0,
   p-85
  );

 const b =
  Math.min(
   text.length,
   p+word.length+135
  );

 return(
  (a ? "…" : "")
  +
  text.slice(a,b)
  +
  (
   b<text.length
    ? "…"
    : ""
  )
 );

}


function shardForGram(gram){

 let total = 0;

 for(const ch of gram){
  total +=
   ch.codePointAt(0);
 }

 return total % 128;

}


async function loadShard(id){

 if(
  shardCache.has(id)
 ){
  return shardCache.get(id);
 }

 const r =
  await fetch(
   GLOBAL_SHARD(id),
   {
    cache:"no-store"
   }
  );

 if(!r.ok){

  if(r.status===404){

   const empty = {
    postings:{}
   };

   shardCache.set(
    id,
    empty
   );

   return empty;

  }

  throw new Error(
   `HTTP ${r.status}`
  );

 }

 const j =
  await r.json();

 shardCache.set(
  id,
  j
 );

 return j;

}


async function globalCandidates(
 word
){

 const q =
  norm(word);

 const n =
  q.length>=3
   ? 3
   : 2;

 const gs =
  grams(
   word,
   n
  );

 if(!gs.length){
  return new Map();
 }

 const shardIds =
  [
   ...new Set(
    gs.map(
     shardForGram
    )
   )
  ];

 const loaded =
  await Promise.all(
   shardIds.map(
    async id => [
     id,
     await loadShard(id)
    ]
   )
  );

 const byShard =
  new Map(loaded);

 const gramMaps =
  gs.map(g=>{

   const shard =
    byShard.get(
     shardForGram(g)
    );

   return(
    shard?.postings || {}
   )[
    `${n}:${g}`
   ] || {};

  });

 if(
  gramMaps.some(
   m =>
    !Object.keys(m).length
  )
 ){
  return new Map();
 }

 const result =
  new Map();

 for(
  const [vid,deltas]
  of Object.entries(
   gramMaps[0]
  )
 ){

  if(
   !gramMaps.every(
    m =>
     Object.prototype
      .hasOwnProperty
      .call(m,vid)
   )
  ){
   continue;
  }

  let times =
   decode(deltas);

  for(
   let i=1;
   i<gramMaps.length;
   i++
  ){

   const other =
    new Set(
     decode(
      gramMaps[i][vid]
     )
    );

   times =
    times.filter(
     t => other.has(t)
    );

   if(!times.length){
    break;
   }

  }

  if(times.length){

   result.set(
    vid,
    times
   );

  }

 }

 return result;

}


async function loadCatalog(){

 try{

  const r =
   await fetch(
    CATALOG,
    {
     cache:"no-store"
    }
   );

  if(!r.ok){
   throw new Error();
  }

  const j =
   await r.json();

  catalog =
   j.videos || [];

  try{

   const gr =
    await fetch(
     GLOBAL_MANIFEST,
     {
      cache:"no-store"
     }
    );

   if(gr.ok){
    globalManifest =
     await gr.json();
   }

  }catch(e){

   globalManifest = null;

  }

  $("loadStatus")
   .className =
   "status ok";

  $("loadStatus")
   .textContent =
   globalManifest
    ? `✓ ${catalog.length}本が高速検索できます`
    : `✓ ${catalog.length}本が検索できます`;

  $("summary")
   .textContent =
   "検索ワードを入力してください";

 }catch(e){

  $("loadStatus")
   .className =
   "status error";

  $("loadStatus")
   .textContent =
   "検索インデックスがまだありません。GitHub Actions の Update Search Index を一度実行してください。";

  $("summary")
   .textContent =
   "検索データを準備中です";

 }

}


async function search(){

 const titleWord =
  $("titleSearch")
   .value
   .trim();

 const word =
  $("search")
   .value
   .trim();

 $("results")
  .innerHTML = "";

 if(
  !titleWord &&
  !word
 ){

  $("summary")
   .textContent =
   "動画タイトルまたは字幕の検索ワードを入力してください";

  return;

 }

 if(
  word &&
  norm(word).length<2
 ){

  $("summary")
   .textContent =
   "字幕は2文字以上で検索してください";

  return;

 }

 let targets =
  catalog.filter(
   v =>
    currentChannel==="all"
    ||
    v.channel===
    currentChannel
  );

 if(titleWord){

  const tq =
   norm(titleWord);

  targets =
   targets.filter(
    v =>
     norm(v.title)
      .includes(tq)
   );

 }

 const label =
  titleWord && word
   ? `タイトル「${titleWord}」＋字幕「${word}」`
   : titleWord
    ? `タイトル「${titleWord}」`
    : `字幕「${word}」`;

 $("summary")
  .textContent =
  `${label}を検索中…`;

 let found = [];

 if(!word){

  found =
   targets.map(
    v => ({
     ...v,
     times:[]
    })
   );

 }else{

  if(globalManifest){

   try{

    const candidates =
     await globalCandidates(
      word
     );

    found =
     targets
      .filter(
       v =>
        candidates.has(
         v.videoId
        )
      )
      .map(
       v => ({
        ...v,
        times:
         candidates.get(
          v.videoId
         )
       })
      );

   }catch(e){

    console.error(e);

    $("summary")
     .textContent =
     "高速検索データの読み込みに失敗しました";

    return;

   }

  }else{

   $("summary")
    .textContent =
    "高速検索データを準備中です。Update Search Index を一度実行してください。";

   return;

  }

 }

 found.sort(
  (a,b) =>
   String(
    b.publishedAt
   ).localeCompare(
    String(
     a.publishedAt
    )
   )
 );

 lastMatches =
  found;

 if(!found.length){

  $("summary")
   .textContent =
   `${label}：該当する動画はありません`;

  $("results")
   .innerHTML =
   '<div class="empty">該当する動画・シーンがありません</div>';

  return;

 }

 $("summary")
  .textContent =
  `${label}：${found.length}本の動画が見つかりました`;

 if(
  word &&
  found.length===1
 ){

  showDetails(
   found[0],
   word
  );

  return;

 }

 if(!word){

  $("results")
   .innerHTML =
   found.map(v=>`

<div class="result">

<div class="channel ${v.channel}">
${esc(v.channelName)}
</div>

<div class="title">
${esc(v.title)}
</div>

<a
 class="watch"
 href="https://www.youtube.com/watch?v=${v.videoId}"
 target="_blank"
 rel="noopener"
>
▶ YouTubeで見る
</a>

</div>

`).join("");

  return;

 }

 $("results")
  .innerHTML =
  found.map(
   (v,i) => `

<div class="result">

<div class="channel ${v.channel}">
${esc(v.channelName)}
</div>

<div class="title">
${esc(v.title)}
</div>

<div class="count">
候補 ${v.times.length}区間
</div>

<button
 class="open"
 data-i="${i}"
>
この動画のシーンを見る
</button>

</div>

`
  ).join("");

 document
  .querySelectorAll(
   ".open"
  )
  .forEach(
   b =>
    b.onclick =
     () =>
      showDetails(
       found[
        Number(
         b.dataset.i
        )
       ],
       word,
       true
      )
  );

}


async function showDetails(
 v,
 word,
 showBack=false
){

 $("summary")
  .textContent =
  "字幕を読み込んで候補を確認しています…";

 $("results")
  .innerHTML = "";

 try{

  const r =
   await fetch(
    API(v.videoId),
    {
     cache:"no-store"
    }
   );

  if(!r.ok){
   throw new Error(
    `HTTP ${r.status}`
   );
  }

  const rows =
   parseTranscript(
    await r.text()
   );

  const q =
   norm(word);

  let hits =
   rows.filter(
    row =>
     norm(row.x)
      .includes(q)
   );

  if(
   !hits.length &&
   v.times?.length
  ){

   const candidateSet =
    new Set(
     v.times
    );

   hits =
    rows.filter(
     row =>
      candidateSet.has(
       Math.floor(
        row.t
       )
      )
    );

  }

  $("summary")
   .textContent =
   `「${word}」：${hits.length}件見つかりました`;

  const safe =
   word.replace(
    /[.*+?^${}()|[\]\\]/g,
    "\\$&"
   );

  const rx =
   new RegExp(
    safe,
    "gi"
   );

  const back =
   showBack
    ? '<button class="back" id="backButton">← 動画一覧に戻る</button>'
    : "";

  $("results")
   .innerHTML =
   back
   +
   (
    hits.map(
     h => {

      const text =
       esc(
        makeSnippet(
         h.x,
         word
        )
       ).replace(
        rx,
        m =>
         `<mark>${m}</mark>`
       );

      const url =
       `https://www.youtube.com/watch?v=${v.videoId}&t=${Math.floor(h.t)}s`;

      return `

<div class="result">

<div class="channel ${v.channel}">
${esc(v.channelName)}
</div>

<div class="title">
${esc(v.title)}
</div>

<div class="time">
${fmt(h.t)}
</div>

<div class="text">
${text}
</div>

<a
 class="watch"
 href="${url}"
 target="_blank"
 rel="noopener"
>
▶ この場面からYouTubeで見る
</a>

</div>

`;

     }
    ).join("")
    ||
    '<div class="empty">候補を確認しましたが完全一致はありませんでした</div>'
   );

  if(showBack){

   $("backButton")
    .onclick =
    () => search();

  }

 }catch(e){

  $("summary")
   .textContent =
   "この動画の字幕を読み込めませんでした";

  $("results")
   .innerHTML =
   '<div class="empty">字幕取得先の一時的な制限などの可能性があります。時間をおいてもう一度お試しください。</div>';

 }

}


$("searchButton")
 .addEventListener(
  "click",
  search
 );


$("search")
 .addEventListener(
  "keydown",
  e => {

   if(e.key==="Enter"){
    search();
   }

  }
 );


$("titleSearch")
 .addEventListener(
  "keydown",
  e => {

   if(e.key==="Enter"){
    search();
   }

  }
 );


document
 .querySelectorAll(
  ".filter"
 )
 .forEach(
  b =>
   b.addEventListener(
    "click",
    () => {

     document
      .querySelectorAll(
       ".filter"
      )
      .forEach(
       x =>
        x.classList.remove(
         "active"
        )
      );

     b.classList.add(
      "active"
     );

     currentChannel =
      b.dataset.channel;

     if(
      $("search")
       .value
       .trim()
      ||
      $("titleSearch")
       .value
       .trim()
     ){
      search();
     }

    }
   )
 );


loadCatalog();

</script>

</body>
</html>
